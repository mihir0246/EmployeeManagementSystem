# H2 In-Memory Database Profile
spring.application.name=employee-management-system
server.port=8081

# H2 In-Memory DataSource Configuration (MySQL Compatibility Mode)
spring.datasource.url=jdbc:h2:mem:employee_db;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA and Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Enable H2 Web Console at http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Enable static resource handling for frontend
spring.web.resources.static-locations=classpath:/static/

# Logging
logging.level.com.example.employee=DEBUG
